# =========================================================
# MPC Configuration
# =========================================================

control_frequency: 20.0

mpc:
  horizon: 28
  dt: 0.05             # control_frequency(20Hz=50ms)와 정합.
  max_iterations: 25
  wheelbase: 3.0

cost:
  path_error: 6.0
  heading_error: 3.0      # 6.0→3.0: 과도한 heading 보정이 오버슈트 유발
  speed_error: 2.0        # 3.0→2.0: 급정거 방지
  control: 1.25            # 2.0→1.0: steer effort 페널티 완화
  control_rate: 100.0     # 90~110 사이의 값으로 조절해야함.
  control_rate_accel: 4.5
  terminal: 8.0

solver:
  lr_init: 0.20
  lr_min: 0.0001
  convergence_eps: 0.001
  line_search_steps: 7

constraints:
  steering:
    max_angle: 0.6981     # ~40 deg [rad]
    max_rate: 1.0         # 0.4→1.0: 너무 작으면 solver 출력이 매 사이클 잘려서 흔들림
  acceleration:
    max_forward: 2.0
    max_reverse: -5.0
  velocity:
    min: 0.0
    max: 60.0