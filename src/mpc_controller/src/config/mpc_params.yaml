# =========================================================
# MPC Configuration
# =========================================================

control_frequency: 20.0

mpc:
  horizon: 28
  dt: 0.05             # control_frequency(20Hz=50ms)와 정합. 이전 dt=0.1은 실제 루프 주기의 2배라
                        # clipSteeringRate의 max_step(=max_rate*dt)이 매 사이클 2배로 허용되던 버그가 있었음.
  max_iterations: 25
  wheelbase: 3.0

cost:
  # 4.0→6.0: 실측 재현 결과 선회 중 차선 중앙에서 벗어난 채(횡방향 잔차) 유지되는
  # 경향이 있었다 - path_error가 heading_error/speed_error 대비 상대적으로 약해서
  # solver가 속도/헤딩을 맞추는 쪽을 더 싸게 여긴 것으로 보임. 위치 추종을 더
  # 강하게 우선하도록 올린다.
  path_error: 6.0
  heading_error: 3.0      # 6.0→3.0: 과도한 heading 보정이 오버슈트 유발
  speed_error: 2.0        # 3.0→2.0: 급정거 방지
  control: 1.25            # 2.0→1.0: steer effort 페널티 완화
  # 15.0→95.0: 완만한 곡선을 지속 추종할 때 d가 최대 0.47m까지 벌어지는
  # 문제를 하네스 closed-loop 시뮬레이션(Frenet+MPC를 실제 코드로 묶어
  # kinematic bicycle 모델로 여러 사이클 돌림, 모델 불일치 없음)으로 재현.
  # path_error/heading_error/lateral_error를 올리는 건 전부 역효과였고
  # (반직관적이지만 실측 확인됨), control_rate(조향 변화율 감쇠)만 올리는
  # 게 유일하게 단조 개선됐다 - 댐핑 부족으로 인한 오버슈트였다는 뜻.
  # 완만한 곡선(kappa~0.02)과 급커브(kappa~0.11) 양쪽에서 스윕한 결과
  # 90~100 구간이 공통 최적점(그 밑/위 모두 다시 나빠짐 - 진동 vs 둔한
  # 반응의 트레이드오프).
  control_rate: 100.0
  # accel 변화율 억제 — control_rate와 완전히 분리(예전엔 control_rate*0.3로
  # 파생시켜서 같이 묶여 있었음). control_rate를 95까지 올려도 이 값은 그대로
  # 둬서(예전 15*0.3=4.5와 동일) 오늘 아침 고친 bang-bang accel이 재발하지
  # 않게 한다(실측 확인).
  control_rate_accel: 4.5
  terminal: 8.0

solver:
  # 0.05는 완만한 직선 구간에선 충분했지만, 코너처럼 heading_ref가 horizon 안에서
  # 크게 꺾이는 경우 25 iteration 안에 충분히 수렴하지 못해 조향이 덜 꺾이는
  # 문제가 있었다(실측: 목표 heading 변화 0.45rad 중 0.16rad를 못 따라감).
  # lr_init을 0.20으로 올리면 같은 iteration 수/솔브타임(~1ms)에서 훨씬 더
  # 수렴해 heading 추종 잔차가 크게 줄어든다(standalone 검증 완료).
  lr_init: 0.20
  lr_min: 0.0001
  convergence_eps: 0.001
  line_search_steps: 7

constraints:
  steering:
    max_angle: 0.6981     # ~40 deg [rad]
    max_rate: 1.0         # 0.4→1.0: 너무 작으면 solver 출력이 매 사이클 잘려서 흔들림
  acceleration:
    max_forward: 2.0
    max_reverse: -5.0
  velocity:
    min: 0.0
    max: 60.0

# waypoint 직접 추종 + 곡률 기반 감속은 frenet_planner로 이전됨
# (frenet_planner/config/params.yaml의 planner/curve_speed, waypoint_file 참고)