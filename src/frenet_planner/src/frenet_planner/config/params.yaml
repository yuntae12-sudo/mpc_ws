# =========================================================
# Frenet Frame Planner 파라미터 (mpc_controller에 통합된 버전)
# FSM(behavior_planner) 미연동 상태: 모드 전환 조건을 frenet_planner.cpp에
# 직접 하드코딩해서 검증 중 (LANE_KEEPING/FOLLOWING 완료, AVOID/Merge는
# 아직). behavior_planner 연동은 각 모드 검증이 끝난 후 별도 단계에서.
# =========================================================

planner:
  wheelbase: 3.0    # [m] mpc_controller/src/config/mpc_params.yaml과 동일 값 유지
  lane_width: 3.5   # [m] LANE_CHANGE 오프셋, FindLeader의 "내 차선" 판정(|d|<=lane_width/2)에 사용

  # --- 곡률 기반 사전 감속 (mpc_controller 옛 path_planner.cpp에서 이식) ---
  curve_speed:
    target_vel: 10.0
    curve_vel_sharp: 4.0
    curve_vel_mid:   5.5
    curve_vel_mild:  7.0
    curve_th_sharp:  0.080
    curve_th_mid:    0.035
    curve_th_mild:   0.015
    curve_lookahead_m: 15.0

  # --- Following(Sec.V-A, constant-time-gap-law) ---
  following:
    time_gap: 1.0              # [s] tau - 목표 gap = min_gap + time_gap*leader_speed
    min_gap: 5.0               # [m] D0 - 정지 시에도 유지할 최소 거리
    max_leader_search_s: 60.0  # [m] 이 거리 안의 선두 차량만 후보로 봄

  # --- AVOID (Sec.VI SAT 충돌필터 + lateral 오프셋). FSM 미연동 상태의
  # 임시 트리거: "내 차선을 막는 정지/저속 장애물이 가까이 있으면 피한다" ---
  avoid:
    trigger_distance: 20.0    # [m] 이 거리 안의 장애물만 회피 트리거 검토
    trigger_max_speed: 0.5    # [m/s] 이 속도 이하만 "정지 장애물"로 간주(그 이상은 Following)
    avoid_offset: 3.0         # [m] 회피 시 lateral_d1 격자를 밀어낼 크기

  # --- 실시간 후보 경로 디버그 시각화 -----------------------
  # Planner가 최신 스냅샷을 원자적으로 갱신하고 tools/planner_visualizer.py가 읽는다.
  visualization:
    enabled: true
    publish_hz: 5.0
    snapshot_path: "/tmp/frenet_planner_debug.json"

  # --- PathGeneratorConfig (path_generator.hpp) ---------------
  path_generator:
    lateral_d1:     { min: -3.0, max: 3.0, step: 0.5 }
    # min=2.0이면 lateral 보정 시간(T)이 MPC horizon(28*0.05=1.4s)보다 길어서
    # MPC가 그 보정의 극히 일부만 보고 계획하게 되고, offset이 커질수록 quintic
    # jerk 비용 때문에 오히려 더 긴 T를 고르게 돼(실측: best_T가 2.0→5.0까지 계속
    # 증가) 보정 속도가 점점 느려지는 악순환이 있었다(완만한 곡선 주행 중 d가
    # -0.2→-5m까지 벌어짐). min을 1.4s 근방인 1.5로 낮춰서 보정이 MPC horizon
    # 안에서 실제로 완결되도록 함 — 급코너/완만한 곡선 모두 재검증 완료.
    time_horizon:   { min: 1.5,  max: 5.0, step: 0.5 }
    delta_s:        { min: -3.0, max: 3.0, step: 1.0 }
    delta_s_dot:    { min: -2.0, max: 2.0, step: 1.0 }
    dt: 0.1

  # --- KinematicLimits (path_generator.hpp) -------------------
  kinematic_limits:
    max_lateral_accel: 3.0
    max_longitudinal_accel: 3.0
    max_curvature: 0.1704

  # --- CostWeights (cost.hpp) ---------------------------------
  cost_weights:
    # kj=1.0이면 quintic의 jerk 항이 지나치게 세서, d1=0(중앙 복귀)을 고르더라도
    # "천천히"(T=3~4s) 복귀하는 후보만 저렴해진다. 문제는 이게 매 사이클(20Hz)
    # 새로 계획되는 receding-horizon이라 코너 주행 중 발생하는 위치오차 누적
    # 속도가 이 느린 복귀 속도를 앞질러서 결과적으로 d가 계속 벌어지기만 했다
    # (실측: kj=1.0에서 d -0.6→-1.2m로 계속 벌어짐). kj를 0.1로 낮추면 짧은 T
    # 후보의 jerk 페널티가 확 줄어 더 빠른 복귀가 선택되고, 실측으로 코너 구간
    # 동안 d가 -0.63→0m까지 정상적으로 재추종하는 것을 확인했다.
    kj: 0.1
    kt: 1.0
    # kd=1.0이면 d1^2 항이 jerk/time 항에 비해 너무 작아서(예: |d1|=0.5 하나 차이가
    # 겨우 0.25) "차선 중앙(d1=0)으로 복귀"보다 "지금 offset 그대로 유지"가 항상
    # 더 싸게 나와 절대 재추종을 못 했다(실측: 코너에서 d가 -0.6→-4.5m까지 계속
    # 벌어지기만 함). kd=20으로 올려 d1=0 복귀가 실제로 최저비용이 되도록 함.
    kd: 20.0
    # kd*d1^2는 "T 끝에서 d가 0으로 돌아오는지"만 보고, 그 사이 얼마나 넓게
    # 벌어져 있었는지는 전혀 안 본다. kj를 0.1로 낮춰둔 상태라 "끝에서만 살짝
    # 중앙에 붙고 중간엔 넓게 도는" 저저크 경로가 kd 비용 그대로 0이면서 더
    # 싸져버렸다(실측: 급커브에서 d가 -0.03→-2.7m까지 부풀었다가 되돌아옴).
    # 경로 전체 d^2 적분(cost.cpp의 kd_path 항)에 이 가중치를 줘서, 중간에
    # 오래/멀리 벗어나 있으면 그만큼 비용이 쌓이게 한다.
    # kd_path=2.0은 너무 약해서 문제였다: d가 아직 작을 때(-0.23m 근방)도
    # kd_path=2가 T=2.0(느긋한 복귀)를 T=1.5(빠른 복귀)보다 더 싸다고 판단해
    # 버렸고, 그 사이 곡선이 계속 휘어들며 d가 -1.4m 이상까지 눈덩이처럼
    # 불어난 뒤에는 곡률/조향 한계상 어떤 kd_path를 줘도(2~40 스윕) 되돌아오는
    # 속도 자체가 거의 안 바뀌었다(실측: max|d| 1.637→1.609). 즉 이미 벌어진
    # 뒤에는 비용함수로 못 고치고, 작을 때 빠르게 눌러야 한다. kd_path=30으로
    # 올리면 d=-0.23m 상태에서 T=2.0/max|d|=0.37 대신 T=1.5/max|d|=0.30을
    # 고르게 되고(실측), d=0 근방 직선 주행에는 영향이 없다(실측: max|d|=0.085
    # 로 kd_path 2~80 전부 동일). 세밀하게 스윕해보니 T=1.5 선택 임계값이
    # kd_path=32 근방이라 여유있게 35로 둠(30은 임계값 아래라 효과 없음).
    # 참고: 이미 d=-1.45m까지 벌어진 상태에서는 kd_path>=28 근방부터 d1(끝)이
    # 0 대신 0.5(lateral_d1 그리드 한 칸)로 정착하는 부작용이 있음 - lateral_d1
    # 그리드 step=0.5 이산화 때문. 다만 이 상태 자체가 "이미 늦은" 상태라, 이번
    # 수정의 목적은 애초에 d가 여기까지 벌어지지 않게(작을 때 빨리 잡게)
    # 하는 것 - 실제 주행에서 이 부작용을 보이면 lateral_d1 step을 줄이는
    # 방향으로 재검토.
    kd_path: 35.0
    ks: 1.0
    ks_dot: 1.0
    klat: 1.0
    klon: 1.0

  # --- VehicleShape (collision_checker.hpp) -------------------
  vehicle_shape:
    width: 1.9
    length: 4.5

  # --- CollisionCheckConfig (collision_checker.hpp) -----------
  collision_check:
    safety_margin: 0.3
    margin_growth_rate: 0.1
    reactive_lookahead: 8.0

waypoint_file: "/home/autonav/mpc_ws/src/frenet_planner/src/config/2026_molit_comp_global_path.txt"
